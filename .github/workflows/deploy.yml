name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create environment file
        run: |
          mkdir -p src/environments
          echo "export const environment = { production: true, apikey: '${{ secrets.TMDB_API_KEY }}' };" > src/environments/environment.prod.ts
      - run: npx ng build --base-href /${{ github.event.repository.name }}/
      - name: SPA fallback for refreshes
        run: cp dist/movie-app/browser/index.html dist/movie-app/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/movie-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4